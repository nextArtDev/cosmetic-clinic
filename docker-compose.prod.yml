# Production stack for the VPS deployment.
# nginx is the only internet-facing container (port 80). Everything else
# stays on the internal Docker network.
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - edge

  app:
    image: ${APP_IMAGE:?Set APP_IMAGE in .deploy.env or your shell}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    volumes:
      - next_cache:/app/.next/cache
      # App writes uploads into public/uploads (localUpload.ts)
      - uploads_data:/app/public/uploads
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then((res)=>process.exit(res.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - edge

  migrate:
    image: ${MIGRATION_IMAGE:?Set MIGRATION_IMAGE in .deploy.env or your shell}
    profiles:
      - ops
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    restart: "no"
    networks:
      - edge

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - uploads_data:/data/uploads:ro
    depends_on:
      - app
    networks:
      - edge

networks:
  edge:

volumes:
  postgres_data:
  next_cache:
  uploads_data:
